<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemoryLane extension Automatic (design reference)</title>
<!-- Static design reference for MemoryLane. Sample content only; see docs/IMPLEMENTATION_PLAN.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ededed}
</style>
<style>html{background:#0f0f0f}</style>
</head>
<body>
<div style="box-sizing:border-box;width:380px;height:360px;background:#161616;color:#ededed;font-family:'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;justify-content:space-between;min-height:36px;padding:14px 16px;border-bottom:1px solid #232323">
<span style="font-size:14px;font-weight:500;letter-spacing:0.02em">MemoryLane</span>
<button type="button" aria-label="Account" style="width:36px;height:36px;border:1px solid #2e2e2e;border-radius:50%;background:transparent;color:#ededed;font:inherit;font-size:13px">Y</button>
</div>
<div style="flex:1;padding:16px;display:flex;flex-direction:column;gap:16px">
<div style="padding:12px;background:#1c1c1c;border:1px solid #2a2a2a;border-radius:10px">
<div style="display:flex;gap:12px;align-items:center">
<span style="flex:none;width:32px;height:32px;border:1px solid #2e2e2e;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#a8a8a8">M</span>
<div style="min-width:0"><div style="font-size:14px;font-weight:500;line-height:1.35">How neural networks learn from examples</div><div style="font-size:12px;color:#8c8c8c;margin-top:2px">ml-notes.example.com</div></div>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;font-size:12px;color:#a8a8a8"><span style="display:flex;align-items:center;gap:8px"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ededed"></span>Saving automatically · last saved 2 min ago</span></div>
</div>
<button type="button" style="height:44px;border:1px solid #3a3a3a;border-radius:10px;background:transparent;color:#ededed;font:inherit;font-size:14px">Skip this site</button>
<div style="text-align:center;font-size:13px"><a href="#">Search your saved pages ↗</a></div>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid #232323;font-size:12px"><div style="display:flex;align-items:center;gap:8px;color:#a8a8a8"><span>Auto-capture</span><button type="button" role="switch" aria-checked="true" aria-label="Auto-capture" style="position:relative;width:30px;height:18px;padding:0;border-radius:9px;border:1px solid #ededed;background:#ededed"><span style="position:absolute;top:2px;left:14px;background:#161616;width:12px;height:12px;border-radius:50%"></span></button></div><a href="#">Excluded sites</a></div>
</div>
</body>
</html>
