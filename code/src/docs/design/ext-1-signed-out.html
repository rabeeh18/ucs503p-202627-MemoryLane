<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemoryLane extension Signed out (design reference)</title>
<!-- Static design reference for MemoryLane. Sample content only; see docs/IMPLEMENTATION_PLAN.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ededed}
</style>
<style>html{background:#0f0f0f}</style>
</head>
<body>
<div style="box-sizing:border-box;width:380px;height:360px;background:#161616;color:#ededed;font-family:'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;justify-content:space-between;min-height:36px;padding:14px 16px;border-bottom:1px solid #232323">
<span style="font-size:14px;font-weight:500;letter-spacing:0.02em">MemoryLane</span>

</div>
<div style="flex:1;padding:24px 16px 16px;display:flex;flex-direction:column;gap:16px">
<div>
<div style="font-size:17px;font-weight:500;line-height:1.35">Sign in to start remembering</div>
<p style="margin:8px 0 0;font-size:13px;line-height:1.5;color:#a8a8a8">Save pages as you browse, then find them later by meaning. Your saved pages are visible only to you.</p>
</div>
<button type="button" style="height:44px;border:0;border-radius:10px;background:#ededed;color:#161616;font:inherit;font-size:14px;font-weight:500">Continue with Google</button>
<button type="button" style="height:44px;border:1px solid #3a3a3a;border-radius:10px;background:transparent;color:#ededed;font:inherit;font-size:14px">Continue with email</button>
</div>
<div style="padding:12px 16px;border-top:1px solid #232323;font-size:12px"><a href="#">Privacy</a></div>
</div>
</body>
</html>
