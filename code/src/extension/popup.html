<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MemoryLane</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <span class="wordmark">MemoryLane</span>
      <div class="account" id="account" hidden>
        <button type="button" class="account-button" id="account-button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu"></button>
        <div class="menu" id="account-menu" role="menu" hidden>
          <div class="menu-email" id="menu-email" role="presentation"></div>
          <button type="button" role="menuitem" id="sign-out">Sign out</button>
        </div>
      </div>
    </header>

    <main class="body" id="body" aria-live="polite"></main>

    <footer class="footer" id="footer"></footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
