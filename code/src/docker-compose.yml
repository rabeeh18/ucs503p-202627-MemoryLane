# MemoryLane on one host: Solr + FastAPI + Caddy (HTTPS, static frontend, /api proxy).
# Run from code/src with a filled-in .env (see .env.example and deploy/README.md).
services:
  solr:
    image: solr:9.7
    environment:
      SOLR_HEAP: ${SOLR_HEAP:-1g}
    volumes:
      - solr_data:/var/solr
    # Localhost only: the setup and re-index scripts reach it from the host shell.
    ports:
      - "127.0.0.1:8983:8983"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8983/solr/admin/info/system || curl -sf -o /dev/null http://localhost:8983/solr/admin/info/system"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      SOLR_URL: http://solr:8983/solr/memorylane_v2
    volumes:
      - models:/models
    depends_on:
      solr:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_COGNITO_DOMAIN: ${VITE_COGNITO_DOMAIN}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID}
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI}
        VITE_LOGOUT_URI: ${VITE_LOGOUT_URI}
    environment:
      DOMAIN: ${DOMAIN}
      COGNITO_DOMAIN: ${VITE_COGNITO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  # Pinned to the volume the previous docker-compose.yml created when run from
  # code/src (project "src"), so the old `memorylane` core is kept. Override
  # with SOLR_VOLUME if `docker volume ls` shows a different name.
  solr_data:
    name: ${SOLR_VOLUME:-src_solr_data}
  models:
  caddy_data:
  caddy_config:
