site_name: "MemoryLane"
site_url: https://rabeeh18.github.io/ucs503p-202627-MemoryLane/

theme:
  name: material
  custom_dir: docs/assets/theme-overrides

  features:
    - navigation.footer
    - header.autohide
    - content.tabs.link
    - navigation.tracking
    - navigation.top
    - toc.integrate
    - content.tooltips

  icon:
    repo: fontawesome/brands/github
    annotation: material/plus-circle-outline

  palette:
    primary: amber
    accent: orange

  logo: assets/tiet-logo.svg
  favicon: assets/favicon.png

repo_url: https://github.com/rabeeh18/ucs503p-202627-MemoryLane
repo_name: ucs503p-202627-MemoryLane

copyright: "MemoryLane - UCS503 Software Engineering Project"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rabeeh18/ucs503p-202627-MemoryLane
      name: MemoryLane GitHub Repository

extra_css:
  - assets/stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css

extra_javascript:
  - https://unpkg.com/katex@0/dist/katex.min.js
  - javascript/arithmatex.js

markdown_extensions:
  - abbr
  - md_in_html
  - attr_list
  - toc:
      permalink: true
  - footnotes

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

  - toc:
      toc_depth: 4

  - sane_lists

nav:
  - Home: index.md

  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - Running MemoryLane: getting-started/running.md

  - Using MemoryLane:
      - Automatic Capture: user-guide/automatic-capture.md
      - Search: user-guide/search.md
      - Voice Search: user-guide/voice-search.md
      - YouTube Memories: user-guide/youtube.md
      - Summarization: user-guide/summarization.md

  - How It Works:
      - Overview: how-it-works/overview.md
      - Capturing Web Content: how-it-works/ingestion.md
      - Content Processing: how-it-works/processing.md
      - Storage: how-it-works/storage.md

  - Architecture:
      - System Architecture: architecture/overview.md
      - Backend: architecture/backend.md
      - Frontend: architecture/frontend.md
      - Processing Architecture: architecture/processing.md
      - Retrieval Architecture: architecture/retrieval.md

  - API Reference:
      - Overview: api/index.md
      - Endpoints: api/endpoints.md

  - Development:
      - Project Structure: development/project-structure.md
      - Testing: development/testing.md

  - Evaluation:
      - Methodology: evaluation/methodology.md
      - Results: evaluation/results.md

  - Privacy: privacy.md
