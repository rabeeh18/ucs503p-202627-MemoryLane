site_name: "MemoryLane"
site_description: "Save pages as you browse and find them later by meaning."
site_url: https://rabeeh18.github.io/ucs503p-202627-MemoryLane/

theme:
  name: material
  custom_dir: docs/assets/theme-overrides

  features:
    - navigation.footer
    - header.autohide
    - content.tabs.link
    - navigation.tracking
    - navigation.top
    - toc.integrate
    - content.tooltips

  icon:
    repo: fontawesome/brands/github
    annotation: material/plus-circle-outline

  palette:
    primary: amber
    accent: orange

  logo: assets/tiet-logo.svg
  favicon: assets/favicon.png

repo_url: https://github.com/rabeeh18/ucs503p-202627-MemoryLane
repo_name: ucs503p-202627-MemoryLane

copyright: "MemoryLane - UCS503 Software Engineering Project"

extra:
  social:
    - icon: material/web
      link: https://memorylane.site
      name: MemoryLane
    - icon: fontawesome/brands/github
      link: https://github.com/rabeeh18/ucs503p-202627-MemoryLane
      name: MemoryLane GitHub Repository

extra_css:
  - assets/stylesheets/extra.css
  - https://unpkg.com/katex@0.16.11/dist/katex.min.css

hooks:
  # Builds the meaning-based search index (needs `pip install model2vec`).
  - hooks/semantic_search.py

extra_javascript:
  - path: assets/javascripts/semantic-search.js
    type: module
  - javascript/arithmatex.js
  - https://unpkg.com/katex@0.16.11/dist/katex.min.js
  - https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js

markdown_extensions:
  - abbr
  - admonition
  - md_in_html
  - attr_list
  - footnotes
  - sane_lists
  - toc:
      permalink: true
      toc_depth: 4

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Hover definitions for terms like BM25 and PKCE on every page.
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

nav:
  - Home:
      - Overview: index.md
      - Problem Statement: problem_statement.md
      - Features: features.md

  - Getting Started:
      - Quick Start (hosted application): getting-started/index.md

  - User Guide:
      - Saving Pages: user-guide/automatic-capture.md
      - Searching: user-guide/search.md
      - Library & Account: user-guide/library.md
      - Summaries: user-guide/summarization.md
      - YouTube Videos: user-guide/youtube.md
      - Voice Search: user-guide/voice-search.md

  - How It Works:
      - Overview: how-it-works/overview.md
      - Capturing Web Content: how-it-works/ingestion.md
      - Content Processing: how-it-works/processing.md
      - Storage: how-it-works/storage.md

  - Architecture:
      - System Architecture: architecture/overview.md
      - Data Flow Diagrams: architecture/data-flow.md
      - Backend: architecture/backend.md
      - Frontend & Extension: architecture/frontend.md
      - Processing Architecture: architecture/processing.md
      - Retrieval Architecture: architecture/retrieval.md
      - Security: architecture/security.md

  - Design Decisions:
      - Overview: decisions/index.md
      - Architecture Decision Records (ADRs):
          - 0001 Solr for keyword and vector search: decisions/0001-solr.md
          - 0002 Reciprocal Rank Fusion: decisions/0002-reciprocal-rank-fusion.md
          - 0003 Relevance floor: decisions/0003-relevance-floor.md
          - 0004 One EC2 instance: decisions/0004-one-ec2-instance.md
          - 0005 Linking sign-ins by email: decisions/0005-link-sign-ins-by-email.md
          - 0006 YouTube captions in the browser: decisions/0006-youtube-in-the-browser.md
          - 0007 Storing reports before emailing: decisions/0007-store-reports-before-emailing.md
          - 0008 Keeping summaries optional: decisions/0008-keep-summaries-optional.md
          - 0009 Removing the library map: decisions/0009-remove-library-map.md
          - 0010 Removing Export my data: decisions/0010-remove-export.md
          - 0011 Auto-capture keeps only content: decisions/0011-auto-capture-keeps-only-content.md

  - Development:
      - Project Structure: development/project-structure.md
      - Installation: development/installation.md
      - Configuration: development/configuration.md
      - Running Locally: development/running-locally.md
      - Testing: development/testing.md
      - Deployment: development/deployment.md
      - Troubleshooting: development/troubleshooting.md

  - API Reference:
      - Overview: api/index.md
      - Endpoints: api/endpoints.md

  - Evaluation:
      - Methodology: evaluation/methodology.md
      - Results: evaluation/results.md

  - Privacy: privacy.md
  - Glossary: glossary.md
