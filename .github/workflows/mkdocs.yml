name: mkdocs
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      # Pinned to the versions the site is built and checked with (MkDocs 2 breaks theme overrides).
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7 pymdown-extensions==11.0.1
      - run: PYTHONPATH=src:$PYTHONPATH mkdocs gh-deploy --force
