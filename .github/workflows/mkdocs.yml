name: mkdocs
# Build-only check: fails on broken links or config. The site itself is published
# by hand with `mkdocs gh-deploy --strict` from the repo root.
on:
  workflow_dispatch:
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "assets/**", ".github/workflows/mkdocs.yml"]
  push:
    branches: [master, main]
    paths: ["docs/**", "mkdocs.yml", "assets/**", ".github/workflows/mkdocs.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      # Pinned to the versions the site is built and checked with (MkDocs 2 breaks theme overrides).
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7 pymdown-extensions==11.0.1
      - run: mkdocs build --strict
